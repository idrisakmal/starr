services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    volumes:
      - ./sonarr:/config
      - ${MEDIA_DIR}:/data
    ports:
      - 8989:8989
    restart: unless-stopped
    environment:
      - PGID=${GROUP_ID}
      - PUID=${USER_ID}
      - TZ=${TIMEZONE}
      - LOG_LEVEL=${LOG_LEVEL}
      - SONARR_API_KEY=${SONARR_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8989/api/v3/health -H \"X-Api-Key: $$SONARR_API_KEY\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    volumes:
      - ./radarr:/config
      - ${MEDIA_DIR}:/data
    ports:
      - 7878:7878
    restart: unless-stopped
    environment:
      - PGID=${GROUP_ID}
      - PUID=${USER_ID}
      - TZ=${TIMEZONE}
      - LOG_LEVEL=${LOG_LEVEL}
      - RADARR_API_KEY=${RADARR_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7878/api/v3/health -H \"X-Api-Key: $$RADARR_API_KEY\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    volumes:
      - ./prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    environment:
      - PGID=${GROUP_ID}
      - PUID=${USER_ID}
      - TZ=${TIMEZONE}
      - LOG_LEVEL=${LOG_LEVEL}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY}
    depends_on:
      - byparr
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9696/api/v1/health -H \"X-Api-Key: $$PROWLARR_API_KEY\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  recyclarr:
    # Pinned to 7.x: v8 is a breaking rewrite (new "providers" layout that fetches
    # the empty `v8` branch of config-templates) and cannot resolve this v7-style
    # config's include templates. Auto-updating to v8.3.2 silently broke every
    # sync from ~Feb 2026. Stay on 7.x until this config is migrated to v8.
    image: recyclarr/recyclarr:7.5.2
    container_name: recyclarr
    volumes:
      - ./recyclarr:/config
    user: ${USER_ID}:${GROUP_ID}
    restart: unless-stopped
    read_only: true
    tmpfs: /tmp
    environment:
      - TZ=${TIMEZONE}
      - RECYCLARR_CREATE_CONFIG=true
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
  byparr:
    # Drop-in replacement for FlareSolverr, which is archived upstream and no
    # longer clears current Cloudflare challenges. Byparr serves the same
    # POST /v1 contract, so Prowlarr still talks to it as a FlareSolverr proxy.
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    ports:
      - 8191:8191
    restart: unless-stopped
    # Camoufox needs real shared memory; /tmp is scratch so keep it in RAM.
    shm_size: 1gb
    tmpfs:
      - /tmp:exec,mode=1777,size=1G
    # The stealth browser is downloaded at runtime (~400MB extracted), which
    # overflows a tmpfs /cache and would re-download on every restart.
    volumes:
      - byparr-cache:/cache
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - TZ=${TIMEZONE}
    healthcheck:
      # /health drives a real browser fetch, so probe it sparingly once up.
      # start_interval keeps the config service's service_healthy gate quick.
      test: ["CMD-SHELL", "curl -f http://localhost:8191/health || exit 1"]
      interval: 5m
      timeout: 60s
      retries: 3
      start_period: 180s
      start_interval: 10s
  config:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: config
    restart: "no"
    user: ${USER_ID}:${GROUP_ID}
    volumes:
      - ./overseerr:/app/overseerr
      - ./sonarr:/app/sonarr
      - ./radarr:/app/radarr
      - ./prowlarr:/app/prowlarr
    environment:
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY}
      - PROWLARR_URL=http://prowlarr:9696
      - FLARESOLVERR_URL=http://byparr:8191
    depends_on:
      prowlarr:
        condition: service_healthy
      byparr:
        condition: service_healthy
    command: ["--apply"]
  seerr:
    # Successor to Overseerr/Jellyseerr - both upstreams were retired and merged
    # into Seerr. The previous config dir is migrated in place on first boot.
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - TZ=${TIMEZONE}
      - PORT=5055
    ports:
      - 5055:5055
    volumes:
      - ./seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    restart: unless-stopped
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    volumes:
      - ./bazarr:/config
      - ${MEDIA_DIR}:/data
    ports:
      - 6767:6767
    restart: unless-stopped
    environment:
      - PGID=${GROUP_ID}
      - PUID=${USER_ID}
      - TZ=${TIMEZONE}
    healthcheck:
      # /api/system/status requires an API key, so check the unauthenticated UI root
      test: ["CMD-SHELL", "curl -f http://localhost:6767/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: always
    environment:
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - seerr
      - sonarr
      - radarr
      - prowlarr
      - bazarr

volumes:
  byparr-cache:
